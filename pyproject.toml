[project]
name = "openmarket"
version = "0.1.0"
description = "台股產業熱力圖看盤介面（本機）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "lxml>=5.2",
    "tzdata>=2024.1",
    "certifi>=2026.7.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmarket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
